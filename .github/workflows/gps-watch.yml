name: GPS movement + signal watch

on:
  schedule:
    # Vercel's own Cron on this project's plan only runs once a day, far too
    # coarse for "alert us while it's still driving away" — this workflow
    # calls the same protected routes on a real interval instead.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Movement-watch and signal-watch used to be two separate endpoints,
      # each fetching the same Wialon unit list independently — doubling
      # both the function invocation count and the Wialon calls for no
      # benefit. Merged into one endpoint (see src/app/api/gps/watch).
      - name: Call gps/watch endpoint
        run: |
          curl -sf -X GET "${{ vars.APP_URL }}/api/gps/watch" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
