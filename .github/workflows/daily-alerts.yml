name: Daily Telegram alerts

# Times are UTC; Tashkent is UTC+5 year-round (no DST), so:
#   16:30 UTC -> 21:30 Toshkent (cash reminder, near end of day)
#   03:00 UTC -> 08:00 Toshkent (oil-change due, start of day)
# The daily summary/closing report is no longer sent on a schedule — the
# accountant's own "Кунни якунлаш" button (or /hisobot on demand) is the
# only trigger now, per explicit request.
on:
  schedule:
    - cron: "30 16 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Cash reminder
        if: github.event.schedule == '30 16 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sf -X GET "${{ vars.APP_URL }}/api/alerts/cash-reminder" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Oil-change due
        if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sf -X GET "${{ vars.APP_URL }}/api/alerts/oil-due" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
